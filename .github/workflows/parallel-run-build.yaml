name: Parallel Run 
on: push
jobs:
  Login-Page-Test-Run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Install npm dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:LoginPage

      - name: Cypress Test Report  
        uses: actions/upload-artifact@v4
        with:
          name: Mochawesome HTML Report - Login Page
          path: cypress/reports/html 


  Product-Page-Test-Run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Install npm dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:homePage

      - name: Cypress Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Mochawesome HTML Report - Product Page E2E 
          path: cypress/reports/html 

  